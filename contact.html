<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact · Blacklund</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">BLACKLUND</a>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="work.html">Work</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <header class="hero small">
        <div class="blob one"></div>
        <div class="blob two"></div>
        <h1 class="split">Contact</h1>
        <p class="subtitle">Say hallo. We don't bite.</p>
    </header>

    <section>
        <div class="contact-grid">
            <div class="card reveal">
                <div class="icon">✉️</div>
                <h3>Email</h3>
                <p>hello@blacklund.com</p>
            </div>
            <div class="card reveal" style="transition-delay: 0.15s;">
                <div class="icon">📍</div>
                <h3>Location</h3>
                <p>Amsterdam, Netherlands</p>
            </div>
            <div class="card reveal" style="transition-delay: 0.3s;">
                <div class="icon">⏰</div>
                <h3>Reply time</h3>
                <p>Usually within a day.</p>
            </div>
        </div>

        <div class="center reveal">
            <a href="mailto:hello@blacklund.com" class="button">Send a message</a>
        </div>
    </section>

    <footer>© 2026 Blacklund · Amsterdam</footer>

    <script src="script.js"></script>
</body>
</html>
